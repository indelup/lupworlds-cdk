openapi: 3.0.0
info:
  title: Lupworlds API
  version: '1.0.0'
  description: 'General purpose API for Lupworlds platform with IAM authorization'

paths:
  /users:
    post:
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-request-validator: all
      summary: Create a new user
      description: Creates a new user with the provided information
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: UsersHandler
        passthroughBehavior: when_no_match
        type: aws_proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
    get:
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-request-validator: all
      summary: List all users
      description: Returns a list of all users
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: UsersHandler
        passthroughBehavior: when_no_match
        type: aws_proxy
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{userId}:
    get:
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-request-validator: params-only
      summary: Get user by ID
      description: Returns a specific user by their ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: UsersHandler
        passthroughBehavior: when_no_match
        type: aws_proxy
        requestParameters:
          integration.request.path.userId: method.request.path.userId
      x-amazon-apigateway-request-parameters:
        method.request.path.userId: true
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
  params-only:
    validateRequestBody: false
    validateRequestParameters: true

components:
  schemas:
    UserInput:
      type: object
      required:
        - twitchId
        - alias
        - allowedRoles
      properties:
        twitchId:
          type: string
          description: Twitch ID of the user
        alias:
          type: string
          description: Display name for the user
        allowedRoles:
          type: array
          items:
            type: string
            enum: [ADMIN, MODERATOR, STREAMER, USER]
          description: Roles assigned to the user
        worldIds:
          type: array
          items:
            type: string
          description: IDs of worlds belonging to this user
          default: []

    User:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              description: Unique identifier for the user
